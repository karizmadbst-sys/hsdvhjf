name: Build Android APK (ECHO)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      create_release:
        description: 'Publish as a GitHub Release (requires push/tag or manual trigger)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 🔨 Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup Java JDK (21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 Setup Android SDK & Accept Licenses
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 platforms;android-35 build-tools;36.0.0 build-tools;35.0.0 platform-tools cmdline-tools;latest'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: 🏗️ Build Web Assets (Vite)
        run: |
          npm run build

      - name: 🔄 Sync Capacitor Android Platform
        run: |
          npx cap sync android

      - name: 🔑 Make gradlew executable
        run: |
          chmod +x ./android/gradlew

      - name: ⚙️ Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
          cd ..
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/ECHO-The-World-Remembers-debug.apk
          echo "Debug APK built successfully at output-apk/ECHO-The-World-Remembers-debug.apk"

      - name: ⚙️ Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          cd android
          ./gradlew :app:assembleRelease --stacktrace --no-daemon || ./gradlew :app:assembleDebug --stacktrace --no-daemon
          cd ..
          mkdir -p output-apk
          # Check if signed release APK exists, otherwise use assembleDebug or unsigned
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output-apk/ECHO-The-World-Remembers-release.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output-apk/ECHO-The-World-Remembers-release-unsigned.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/ECHO-The-World-Remembers-debug.apk
          fi

      - name: 📤 Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ECHO-Android-APK
          path: output-apk/*.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/*.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
